name: Wordpress CI/CD

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint YAML manifests
        run: |
          sudo apt-get install yamllint -y
          yamllint k8s/*.yaml

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer FTP client
        run: sudo apt-get install lftp -y

      - name: Déployer manifests K8s sur FTP
        uses: samkirkland/ftp-deploy-action@v3
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: k8s
          server-dir: RenduDevopsKube/NomPrenomWordpress/


