apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - name: wordpress
          image: wordpress:6.4.3-php8.1-apache
          ports:
            - containerPort: 80
          env:
          - name: WORDPRESS_DB_HOST
            value: db
          - name: WORDPRESS_DB_USER
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: mysql-user
          - name: WORDPRESS_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: mysql-password
          - name: WORDPRESS_DB_NAME
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: mysql-database

